name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: seedexchange-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seedexchange
          POSTGRES_PASSWORD: seedexchange_test
          POSTGRES_DB: seedexchange_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seedexchange -d seedexchange_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      PORT: 4000
      HOST: 127.0.0.1
      APP_URL: http://127.0.0.1:4000
      DATABASE_URL: postgresql://seedexchange:seedexchange_test@127.0.0.1:5432/seedexchange_test
      TEST_DATABASE_URL: postgresql://seedexchange:seedexchange_test@127.0.0.1:5432/seedexchange_test
      PLAYWRIGHT_MUTATING_ACCEPTANCE: '1'
      SESSION_SECRET: ci-only-session-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build production discovery artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -Eeuo pipefail
          release_root="$RUNNER_TEMP/seedexchange-production-discovery"
          mkdir -p "$release_root/src" "$release_root/ops/systemd"
          cp -a dist public "$release_root/"
          cp -a src/templates "$release_root/src/"
          cp -a ops/systemd/production "$release_root/ops/systemd/"
          cp package.json package-lock.json .nvmrc "$release_root/"
          git_tree="$(git rev-parse 'HEAD^{tree}')"
          node dist/scripts/create-release-manifest.js --root="$release_root" --commit="$GITHUB_SHA" --tree="$git_tree" --output="$release_root/RELEASE.json"
          node dist/scripts/verify-release-manifest.js --root="$release_root" --manifest="$release_root/RELEASE.json" --commit="$GITHUB_SHA"
          source_epoch="$(git show -s --format=%ct HEAD)"
          artifact="$GITHUB_WORKSPACE/seedexchange-$GITHUB_SHA.tar.gz"
          tar --sort=name --mtime="@$source_epoch" --owner=0 --group=0 --numeric-owner -czf "$artifact" -C "$release_root" .
          (cd "$GITHUB_WORKSPACE" && sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256")
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: seedexchange-production-discovery-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            seedexchange-${{ github.sha }}.tar.gz
            seedexchange-${{ github.sha }}.tar.gz.sha256
